nodeLinker: node-modules

enableGlobalCache: true

npmRegistryServer: 'https://registry.npmjs.org/'

# Yarn quarantines releases younger than a day (`npmMinimalAgeGate`, 1440 minutes by default) so a
# compromised publish cannot be pulled in the hour it exists. Kept at the default for everything
# third-party. Our own scope is exempt: we are its publisher, and a sync that bumps the Stigg SDK
# should not wait a day to install. The gate applies when resolving a range, not when installing
# from the lockfile, so CI's `--immutable` install never meets it.
npmScopes:
  stigg:
    npmMinimalAgeGate: 0
